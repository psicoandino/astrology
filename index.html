<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUE ASTRO POSITIONS :: PSICOANDINO</title>
    
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="system-bar" data-html2canvas-ignore>
        <div id="auth-status">STATE: GHOST // <span>VIEWING CURRENT TRANSITS</span></div>
        <div class="auth-controls">
            <button onclick="setAuth('GHOST')">GHOST (LOGOUT)</button>
            <button onclick="openLoginModal()" class="btn-highlight">IDENTIFY (LOGIN)</button>
        </div>
    </div>

    <header data-html2canvas-ignore>
        <div>
            <h1>TRUE ASTRO POSITIONS</h1>
            <div id="user-display-info" class="subtitle">Tránsitos Actuales (Tiempo Real)</div>
        </div>
        <div class="controls">
            <button id="export-btn" class="ui-btn" onclick="exportToImage()">[ IMPRIMIR JPEG ]</button>
        </div>
    </header>

    <div id="dashboard-zone">
        </div>

    <div id="login-modal" class="modal-overlay" data-html2canvas-ignore>
        <div class="modal-content">
            <h2>IDENTIFICACIÓN // TRUE SPACES</h2>
            <p>Ingrese sus datos para calcular posiciones exactas.</p>
            
            <div class="input-group">
                <label>NOMBRE O ALIAS (Obligatorio)</label>
                <input type="text" id="input-name" placeholder="Ej. Psicoandino">
            </div>
            
            <div class="input-group">
                <label>FECHA (Obligatorio)</label>
                <input type="date" id="input-date">
            </div>
            
            <div class="input-group">
                <label>HORA (Opcional - Mejora exactitud lunar)</label>
                <input type="time" id="input-time">
                <small>Si se omite, los planetas rápidos mostrarán una posición aproximada (~).</small>
            </div>
            
            <div class="modal-actions">
                <button onclick="closeLoginModal()" class="btn-cancel">CANCELAR</button>
                <button onclick="submitLogin()" class="btn-submit">CONFIRMAR Y CALCULAR</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
